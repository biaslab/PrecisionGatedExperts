params:
  prediction_type: "univariate"
  column: "OT"
  model_type: "noisy_experts_diagonal"
  dataset: "ETTh2"
  dataset_path: "data/ETTh2.csv"
  horizon: 720
  feature_type: "uniwindow"
  inference_iterations: 5
  prediction_iterations: 1
  selected_quantiles: [10, 90]
  experts:
    - "models/ETTh2_h720_s96_CNN_enzyme.jld2"
    - "models/ETTh2_h720_s96_MLP_enzyme.jld2"
    - "models/ETTh2_h720_s96_LSTM_enzyme.jld2"
    - "models/ETTh2_h720_s96_DLinear_enzyme.jld2"
    - "models/ETTh2_h720_s96_NConv_enzyme.jld2"
  priors:
    β:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e3
    τ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e-3
    κ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1.0
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 33
      scale: 0.01
