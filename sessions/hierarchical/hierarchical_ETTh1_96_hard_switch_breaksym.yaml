params:
  prediction_type: "univariate"
  column: "OT"
  model_type: "hierarchical"
  dataset: "ETTh1"
  dataset_path: "data/ETTh1.csv"
  horizon: 96
  inference_iterations: 220
  prediction_iterations: 4
  experts:
    - "models/ETTh1_h96_s96_CNN_enzyme.jld2"
    - "models/ETTh1_h96_s96_MLP_enzyme.jld2"
    - "models/ETTh1_h96_s96_LSTM_enzyme.jld2"
    - "models/ETTh1_h96_s96_DLinear_enzyme.jld2"
    - "models/ETTh1_h96_s96_NConv_enzyme.jld2"
  selected_quantiles: []
  priors:
    τ:
      type: "GammaShapeRate"
      shape: 8.0
      rate: 0.05
    ρ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 5.0
    α:
      value: 0.1
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 22
      scale: 0.01
      break_symmetry_prior: true
      break_symmetry_strength: 0.02
  subsample_size: 512
