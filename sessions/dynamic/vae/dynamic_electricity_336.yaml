params:
  prediction_type: "multivariate"
  model_type: "dynamic"
  dataset: "electricity"
  dataset_path: "data/electricity.csv"
  horizon: 336
  inference_iterations: 500
  prediction_iterations: 3
  feature_type: "vae"
  selected_quantiles: [10, 90]
  experts:
    - "models/electricity_h336_s96_CNN_enzyme.jld2"
    - "models/electricity_h336_s96_MLP_enzyme.jld2"
    - "models/electricity_h336_s96_LSTM_enzyme.jld2"
    - "models/electricity_h336_s96_DLinear_enzyme.jld2"
    - "models/electricity_h336_s96_NConv_enzyme.jld2"
  priors:
    β:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 100.0
    τ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 0.1
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 65
      scale: 11.0
