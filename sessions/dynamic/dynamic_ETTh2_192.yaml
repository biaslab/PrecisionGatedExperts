params:
  prediction_type: "univariate"
  column: "OT"
  model_type: "dynamic"
  dataset: "ETTh2"
  dataset_path: "data/ETTh2.csv"
  horizon: 192
  feature_type: "ae"
  inference_iterations: 500
  prediction_iterations: 1
  experts:
    - "models/ETTh2_h192_s96_CNN_enzyme.jld2"
    - "models/ETTh2_h192_s96_MLP_enzyme.jld2"
    - "models/ETTh2_h192_s96_LSTM_enzyme.jld2"
    - "models/ETTh2_h192_s96_DLinear_enzyme.jld2"
    - "models/ETTh2_h192_s96_NConv_enzyme.jld2"
  priors:
    β:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e3
    τ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e-3
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 33
      scale: 0.01
  subsample_percentage: 0.01
