params:
  prediction_type: "multivariate"
  model_type: "dynamic"
  dataset: "exchange_rate"
  dataset_path: "data/exchange_rate.csv"
  horizon: 720
  inference_iterations: 500
  prediction_iterations: 1
  experts:
    - "models/exchange_rate_h720_s96_CNN_enzyme.jld2"
    - "models/exchange_rate_h720_s96_MLP_enzyme.jld2"
    - "models/exchange_rate_h720_s96_LSTM_enzyme.jld2"
    - "models/exchange_rate_h720_s96_DLinear_enzyme.jld2"
    - "models/exchange_rate_h720_s96_NConv_enzyme.jld2"
  priors:
    β:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1.0
    τ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1.0
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 22
      scale: 1.0
