params:
  prediction_type: "multivariate"
  model_type: "dynamic"
  dataset: "exchange_rate"
  dataset_path: "data/exchange_rate.csv"
  horizon: 192
  inference_iterations: 5
  prediction_iterations: 1
  feature_type: "ae"
  selected_quantiles: [10, 90]
  experts:
    - "models/exchange_rate_h192_s96_CNN_enzyme.jld2"
    - "models/exchange_rate_h192_s96_MLP_enzyme.jld2"
    - "models/exchange_rate_h192_s96_LSTM_enzyme.jld2"
    - "models/exchange_rate_h192_s96_DLinear_enzyme.jld2"
    - "models/exchange_rate_h192_s96_NConv_enzyme.jld2"
  priors:
    β:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e12
    τ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e-2
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 33
      scale: 1.7
  subsample_percentage: 0.01
