params:
  prediction_type: "multivariate"
  model_type: "dynamic_diagonal"
  dataset: "exchange_rate"
  dataset_path: "data/exchange_rate.csv"
  horizon: 336
  feature_type: "window"
  inference_iterations: 5
  prediction_iterations: 1
  selected_quantiles: [10, 90]
  experts:
    - "models/exchange_rate_h336_s96_CNN_enzyme.jld2"
    - "models/exchange_rate_h336_s96_MLP_enzyme.jld2"
    - "models/exchange_rate_h336_s96_LSTM_enzyme.jld2"
    - "models/exchange_rate_h336_s96_DLinear_enzyme.jld2"
    - "models/exchange_rate_h336_s96_NConv_enzyme.jld2"
  priors:
    β:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e6
    τ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1.0
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 57
      scale: 1.0
