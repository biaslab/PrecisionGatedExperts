params:
  pipeline: "neural_ensemble"
  prediction_type: "multivariate"
  column: null
  dataset: "traffic"
  dataset_path: "data/traffic.csv"
  experts:
    - "models/traffic_h336_s96_CNN_enzyme.jld2"
    - "models/traffic_h336_s96_MLP_enzyme.jld2"
    - "models/traffic_h336_s96_LSTM_enzyme.jld2"
    - "models/traffic_h336_s96_DLinear_enzyme.jld2"
    - "models/traffic_h336_s96_NConv_enzyme.jld2"
  train_set: false
  feature_type: "vae"
  quantiles: [10, 90]
  gating:
    layers: 1
    hidden_dim: 64
    n_epochs: 100
    patience: 50
    min_delta: 1.0e-6
    learning_rate: 1.0e-3
  save_dir: "saved_neural_ensemble_models"
