params:
  prediction_type: "univariate"
  column: "OT"
  model_type: "noisy_experts"
  dataset: "ETTh1"
  dataset_path: "data/ETTh1.csv"
  horizon: 96
  feature_type: "uniwindow"
  inference_iterations: 1
  prediction_iterations: 3
  selected_quantiles: []
  experts:
    - "models/ETTh1_h96_s96_CNN_enzyme.jld2"
  priors:
    β:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e3
    τ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1e-3
    κ:
      type: "GammaShapeRate"
      shape: 1.0
      rate: 1.0
    w:
      type: "MvNormalMeanScalePrecision"
      n_features: 33
      scale: 0.01
